<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>六上期末複習站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：每一科是一條「複習路線」，像聯絡簿上的打勾清單：①讀筆記 → ②做測驗 → ③加強練習。
   上方三張科目進度卡是總覽，下方路線是行動；「下一步」標籤告訴學生現在該做什麼。 */
:root{
  --paper:#F3F4F1; --card:#FFFFFF; --ink:#1E2622; --muted:#5E6963; --line:#DCE0DA; --rail:#C9CFC8;
  --sci:#2B5DA6; --sci-soft:#E4ECF7;
  --hea:#2D7A4E; --hea-soft:#E1EFE6;
  --soc:#B2462E; --soc-soft:#F6E5DF;
  --eng:#6B4BA8; --eng-soft:#EEE8F7;      /* 英文 */
  --chi:#9A6A12; --chi-soft:#F6EEDC;      /* 國語 */
  --next:#C98A12; --next-soft:#FBF0D6;
  --f-display:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131715; --card:#1B211E; --ink:#E5EBE7; --muted:#9BA7A0; --line:#2C3530; --rail:#3A453F;
  --sci:#8AB0EC; --sci-soft:#1F2D42; --hea:#71C595; --hea-soft:#1C3125; --soc:#EE9883; --soc-soft:#3B2520; --eng:#BCA4EE; --eng-soft:#2B2540; --chi:#E2B862; --chi-soft:#382E1A;
  --next:#F0C060; --next-soft:#3A2F17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131715; --card:#1B211E; --ink:#E5EBE7; --muted:#9BA7A0; --line:#2C3530; --rail:#3A453F;
  --sci:#8AB0EC; --sci-soft:#1F2D42; --hea:#71C595; --hea-soft:#1C3125; --soc:#EE9883; --soc-soft:#3B2520; --eng:#BCA4EE; --eng-soft:#2B2540; --chi:#E2B862; --chi-soft:#382E1A;
  --next:#F0C060; --next-soft:#3A2F17; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--next);outline-offset:2px}
.sci{--c:var(--sci);--cs:var(--sci-soft)}
.hea{--c:var(--hea);--cs:var(--hea-soft)}
.soc{--c:var(--soc);--cs:var(--soc-soft)}
.eng{--c:var(--eng);--cs:var(--eng-soft)}
.chi{--c:var(--chi);--cs:var(--chi-soft)}

/* 刊頭 */
.mast{padding-top:32px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.mast h1{font-size:clamp(32px,7vw,48px)}
.mast p{color:var(--muted);max-width:36em}

/* 科目總覽卡 */
.overview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.overview .ov{padding:14px}
.ov{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.ov:hover{border-color:var(--c)}
.ov .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ov h2{font-size:24px;color:var(--c)}
.ov .count{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.ov .count small{color:var(--muted);font-weight:400}
.meter{height:8px;border-radius:4px;background:var(--cs);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .3s}
.ov .hint{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov.complete .hint{color:var(--c);font-weight:700}
@media (max-width:760px){
  .overview{grid-template-columns:1fr}
  .ov{display:grid;grid-template-columns:4.5em 1fr auto;align-items:center;gap:4px 12px;padding:12px 14px}
  .ov .top{display:contents}
  .ov h2{grid-row:1/3;font-size:22px}
  .ov .count{grid-column:3;grid-row:1}
  .ov .meter{grid-column:2;grid-row:1}
  .ov .hint{grid-column:2/4;grid-row:2}
}

/* 篩選列 */
.tabs-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;margin-block:-10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700}

/* 路線 */
.subject{display:flex;flex-direction:column;gap:14px;scroll-margin-top:80px}
.subject-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:3px solid var(--c)}
.subject-head h2{font-size:30px;color:var(--c)}
.subject-head span{font-size:14px;color:var(--muted)}
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;position:relative}
.stage:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--rail)}
.stage-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--card);border:2px solid var(--c);color:var(--c);position:relative;z-index:1}
.stage.all-done .stage-dot{background:var(--c);color:var(--card)}
.stage-body{display:flex;flex-direction:column;gap:10px;padding-bottom:22px;min-width:0}
.stage-label{display:flex;align-items:baseline;gap:10px;min-height:44px;align-items:center;flex-wrap:wrap}
.stage-label b{font-size:17px}
.stage-label span{font-size:14px;color:var(--muted)}

.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item.is-next{border-color:var(--next);box-shadow:0 0 0 3px var(--next-soft)}
.item.is-done{background:transparent}
.item.is-done h3,.item.is-done .units{opacity:.6}
.item-top{display:flex;justify-content:space-between;gap:6px 10px;align-items:flex-start;flex-wrap:wrap-reverse}
.item h3{font-size:21px}
.badges{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.badge.src{background:var(--cs);color:var(--c)}
.badge.ver{border:1px solid var(--line);color:var(--muted)}
.badge.ver.new{background:var(--next-soft);border-color:var(--next);color:var(--ink)}
.badge.next{background:var(--next);color:var(--card)}
.units{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:15px}
.units li{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:8px}
.units b{color:var(--c);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:1px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.note{font-size:14px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.open{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--c);color:var(--card);font-weight:700;border-radius:999px;padding:9px 20px}
.open:hover{filter:brightness(1.08)}
.check{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;color:var(--muted)}
.check .box{width:22px;height:22px;border-radius:50%;border:2px solid var(--rail);display:grid;place-items:center;font-size:13px;font-weight:700;color:transparent;transition:all .15s}
.check[aria-pressed="true"]{border-color:var(--c);color:var(--c);font-weight:700}
.check[aria-pressed="true"] .box{background:var(--c);border-color:var(--c);color:var(--card)}

.empty-done{display:flex;gap:12px;align-items:center;background:var(--cs);border-radius:14px;padding:14px 18px;color:var(--c);font-weight:700}
.empty-done .stamp{font-family:var(--f-display);font-size:22px;border:2.5px solid var(--c);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;transform:rotate(-10deg);flex:none}

.foot{font-size:13px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.reset{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.confirm button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;font-size:13px}
.confirm .yes{border-color:var(--soc);color:var(--soc)}
.back{align-self:flex-start;color:var(--muted);text-decoration:none;font-size:14px;border:1.5px solid var(--line);border-radius:999px;padding:3px 12px}
.back:hover{color:var(--ink);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <a class="back" href="./">← 換複習階段</a>
    <span class="eyebrow">六年級上學期・期末考複習</span>
    <h1>六上期末複習站</h1>
    <p>每一科都照著路線走：先讀重點筆記，再做互動測驗。完成一項就打勾，黃框標示的是你的下一步。期末的練習會陸續加進來。</p>
  </header>

  <nav class="overview" id="overview" aria-label="各科進度"></nav>

  <div class="tabs-bar">
    <div class="tabs" role="group" aria-label="依科目篩選" id="tabs">
      <button data-f="all" aria-pressed="true">全部科目</button>
      <button data-f="chi" aria-pressed="false">國語</button>
      <button data-f="sci" aria-pressed="false">自然</button>
      <button data-f="hea" aria-pressed="false">健康</button>
      <button data-f="soc" aria-pressed="false">社會</button>
      <button data-f="eng" aria-pressed="false">英文</button>
    </div>
  </div>

  <main id="list" class="wrap" style="gap:36px"></main>

  <footer class="foot" id="foot">
    <p>打勾紀錄存在這臺裝置的瀏覽器裡，請固定用同一個瀏覽器打開。</p>
    <div id="resetArea"><button class="reset" id="reset">清除所有打勾</button></div>
  </footer>
</div>

<script>
const SUBJECTS={
  chi:{name:"國語",sub:"第7～12課、學習地圖三、四"},
  sci:{name:"自然",sub:"範圍待補"},
  hea:{name:"健康",sub:"範圍待補"},
  soc:{name:"社會",sub:"範圍待補"},
  eng:{name:"英文",sub:"課本第3、4課"}
};
const STAGES={
  note:{n:"1",label:"讀重點筆記",tip:"先把觀念讀熟，注意易錯提醒和口訣"},
  quiz:{n:"2",label:"做互動測驗",tip:"一般版打基礎，進階版練應用；錯題要重做"},
  extra:{n:"3",label:"加強練習",tip:"換一份題目再檢查一次"}
};
const ITEMS=[
  {id:"chi-notes",stage:"note",s:"chi",title:"六上國語期末複習",url:"https://claude.ai/artifact/Gx4kDbu7y7aBM7xkE6jGUE",src:"Claude",
   units:[["第7～9課","大小剛好的鞋子、狐假虎威、空城計"],["第10～12課","耶誕節、下午茶風波、橘子"],["學習地圖","三：事實與觀點、讀懂寓言；四：設問、小說閱讀"]],
   tags:["生字遮住練習","易錯字與多音字","常考重點","46 題小測驗"]},
  {id:"chi-write",stage:"extra",step:"練生字",tip:"先練習，考前做一次最終測驗請家長批改",s:"chi",title:"國語生字手寫本",url:"https://chiaoro.github.io/chinese-handwriting/",src:"Claude",
   units:[["生字","第七～十二課共 109 字（也可切換期中第一～六課）：看注音和語詞，在田字格手寫"],["練習","每次隨機抽 30 字；一般、描紅、進階限時三種方式；錯字本可連寫三次"],["測驗","最終測驗抽 30 字不給提示，家長批改算 100 分"]],
   tags:["田字格手寫","對照課本字","錯字本","家長檢查","最終測驗"]}];

// 打勾紀錄存在這臺平板的瀏覽器裡（同一個瀏覽器、同一個網址打開就會一直在）
const KEY="final-done-r1";
let done={};try{done=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
function saveDone(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
// 題目版本：讓孩子一眼看出哪些題目是新的（new:true 才是這次換過的）
const VER={"chi-notes":["新增 1109",1],"chi-write":["新增 1109",1]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bySubject=k=>ITEMS.filter(i=>i.s===k);
const nextOf=k=>bySubject(k).find(i=>!done[i.id]);
let filter=["chi","sci","hea","soc","eng"].includes(location.hash.slice(1))?location.hash.slice(1):"all";

function renderOverview(){
  document.getElementById("overview").innerHTML=Object.keys(SUBJECTS).map(k=>{
    const all=bySubject(k),n=all.filter(i=>done[i.id]).length,nx=nextOf(k);
    if(!all.length) return `<button class="ov ${k}" data-jump="${k}"><div class="top"><h2>${SUBJECTS[k].name}</h2><span class="count">—</span></div><div class="meter" aria-hidden="true"><i style="width:0"></i></div><span class="hint">練習準備中</span></button>`;
    return `<button class="ov ${k}${nx?"":" complete"}" data-jump="${k}">
      <div class="top"><h2>${SUBJECTS[k].name}</h2><span class="count">${n}<small> / ${all.length}</small></span></div>
      <div class="meter" aria-hidden="true"><i style="width:${n/all.length*100}%"></i></div>
      <span class="hint">${nx?"下一步："+esc(nx.title):"這一科全部完成了"}</span>
    </button>`}).join("");
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.jump;
    if(filter!=="all"&&filter!==k)setFilter(k);
    document.getElementById("s-"+k).scrollIntoView();
  });
}

function itemHTML(it,isNext){
  const d=!!done[it.id],note=it.stage==="note";
  return `<article class="item${isNext?" is-next":""}${d?" is-done":""}">
    <div class="item-top"><h3>${esc(it.title)}</h3>
      <div class="badges">${isNext?`<span class="badge next">下一步</span>`:""}${VER[it.id]?`<span class="badge ver${VER[it.id][1]?" new":""}">${VER[it.id][0]}</span>`:""}<span class="badge src">${it.src}</span></div></div>
    <ul class="units">${it.units.map(u=>`<li><b>${esc(u[0])}</b><span>${esc(u[1])}</span></li>`).join("")}</ul>
    ${it.tags.length?`<div class="chips">${it.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}
    ${it.note?`<p class="note">${esc(it.note)}</p>`:""}
    <div class="actions">
      <a class="open" href="${it.url}" target="_blank" rel="noopener">${note?"開始閱讀":"開始練習"} ↗</a>
      <button class="check" data-id="${it.id}" aria-pressed="${d}"><span class="box" aria-hidden="true">✓</span>${d?(note?"已讀完":"已練習"):(note?"讀完了":"練習完了")}</button>
    </div>
  </article>`;
}

function render(){
  renderOverview();
  const keys=Object.keys(SUBJECTS).filter(k=>filter==="all"||filter===k);
  document.getElementById("list").innerHTML=keys.map(k=>{
    const all=bySubject(k),nx=nextOf(k);
    if(!all.length) return `<section class="subject ${k}" id="s-${k}"><div class="subject-head"><h2>${SUBJECTS[k].name}</h2><span>${SUBJECTS[k].sub}</span></div><p class="note">這一科的期末練習還在準備中，做好後會出現在這裡。</p></section>`;
    // 加強練習的每一項各自成為一步（相鄰且同名的放同一步），其他階段同一步放在一起
    const steps=[];
    Object.keys(STAGES).forEach(st=>{
      const its=all.filter(i=>i.stage===st);
      if(!its.length) return;
      if(st==="extra") its.forEach(i=>{
        const prev=steps[steps.length-1];
        if(i.step&&prev&&prev.label===i.step) prev.its.push(i);
        else steps.push({label:i.step||STAGES.extra.label,tip:i.tip||STAGES.extra.tip,its:[i]});
      });
      else steps.push({label:STAGES[st].label,tip:STAGES[st].tip,its});
    });
    return `<section class="subject ${k}" id="s-${k}">
      <div class="subject-head"><h2>${SUBJECTS[k].name}</h2><span>${SUBJECTS[k].sub}</span></div>
      ${nx?"":`<div class="empty-done"><span class="stamp">讚</span><span>${SUBJECTS[k].name}的筆記和測驗都完成了，考前可以再挑錯題複習。</span></div>`}
      <ol class="route">${steps.map((stp,si)=>{
        const its=stp.its,allDone=its.every(i=>done[i.id]);
        return `<li class="stage${allDone?" all-done":""}">
          <span class="stage-dot" aria-hidden="true">${allDone?"✓":si+1}</span>
          <div class="stage-body">
            <div class="stage-label"><b>${stp.label}</b><span>${stp.tip}</span></div>
            ${its.map(i=>itemHTML(i,nx&&nx.id===i.id)).join("")}
          </div></li>`}).join("")}</ol>
    </section>`}).join("");
  document.querySelectorAll(".check").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;if(done[id])delete done[id];else done[id]=true;saveDone();render();
  });
}

function setFilter(f){
  filter=f;
  document.querySelectorAll("#tabs [data-f]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.f===f));
  try{history.replaceState(null,"",f==="all"?location.pathname+location.search:"#"+f)}catch(e){}
  render();
}
document.querySelectorAll("#tabs [data-f]").forEach(b=>b.onclick=()=>setFilter(b.dataset.f));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["chi","sci","hea","soc","eng"].includes(h)&&h!==filter)setFilter(h)});

const resetArea=document.getElementById("resetArea");
function bindReset(){
  document.getElementById("reset").onclick=()=>{
    resetArea.innerHTML=`<div class="confirm"><span>確定要清除所有打勾嗎？</span><button class="yes" id="yes">清除</button><button id="no">取消</button></div>`;
    document.getElementById("yes").onclick=()=>{done={};saveDone();render();restore()};
    document.getElementById("no").onclick=restore;
  };
}
function restore(){resetArea.innerHTML=`<button class="reset" id="reset">清除所有打勾</button>`;bindReset()}
bindReset();
setFilter(filter);
</script>
</body>
</html>

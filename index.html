<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>六年級複習站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：像聯絡簿的封面目錄，一次考試一張卡；正在準備的考試排第一、標「現在複習這個」。
   色彩與字體沿用各階段複習頁，孩子點進去不會覺得換了網站。 */
:root{
  --paper:#F3F4F1; --card:#FFFFFF; --ink:#1E2622; --muted:#5E6963; --line:#DCE0DA;
  --now:#C98A12; --now-soft:#FBF0D6; --past:#2B5DA6; --past-soft:#E4ECF7;
  --f-display:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131715; --card:#1B211E; --ink:#E5EBE7; --muted:#9BA7A0; --line:#2C3530;
  --now:#F0C060; --now-soft:#3A2F17; --past:#8AB0EC; --past-soft:#1F2D42; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131715; --card:#1B211E; --ink:#E5EBE7; --muted:#9BA7A0; --line:#2C3530;
  --now:#F0C060; --now-soft:#3A2F17; --past:#8AB0EC; --past-soft:#1F2D42; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.mast{padding-top:40px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.mast h1{font-size:clamp(32px,7vw,48px)}
.mast p{color:var(--muted)}
.terms{display:flex;flex-direction:column;gap:16px}
.term{--c:var(--past);--cs:var(--past-soft);display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px 22px;color:inherit;text-decoration:none}
.term.now{--c:var(--now);--cs:var(--now-soft);border-color:var(--now);box-shadow:0 0 0 3px var(--now-soft)}
.term:hover{border-color:var(--c)}
.term:focus-visible{outline:3px solid var(--now);outline-offset:2px}
.seal{grid-row:1/4;width:64px;height:64px;border-radius:50%;border:2.5px solid var(--c);color:var(--c);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;text-align:center}
.term h2{font-size:28px;color:var(--c)}
.term .sub{color:var(--muted);font-size:15px}
.term .row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:14px}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--cs);color:var(--c);white-space:nowrap}
.go{font-weight:700;color:var(--c)}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.foot{font-size:13px;color:var(--muted);text-align:center}
@media (max-width:420px){.term{grid-template-columns:1fr}.seal{grid-row:auto;width:52px;height:52px;font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <span class="eyebrow">六年級・複習站</span>
    <h1>要複習哪一次考試？</h1>
    <p>選一個階段進去，每一科都有讀筆記、做測驗、加強練習的路線。</p>
  </header>
  <nav class="terms" aria-label="選擇複習階段">
    <a class="term now" href="final.html">
      <span class="seal" aria-hidden="true">期末</span>
      <h2>六上期末</h2>
      <p class="sub">國語第7～12課、英文 Unit 3–4，其他科陸續加入</p>
      <p class="row"><span class="tag">現在複習這個</span><span class="count" id="c-final"></span><span class="go">進入 →</span></p>
    </a>
    <a class="term" href="midterm.html">
      <span class="seal" aria-hidden="true">期中</span>
      <h2>六上期中</h2>
      <p class="sub">國語、自然、健康、社會、英文五科</p>
      <p class="row"><span class="tag">已考完，可回顧</span><span class="count" id="c-mid"></span><span class="go">進入 →</span></p>
    </a>
  </nav>
  <p class="foot">打勾紀錄存在這臺裝置的瀏覽器裡，請固定用同一個瀏覽器打開。</p>
</div>
<script>
// 顯示各階段已打勾幾項（讀不到紀錄就不顯示）
[["c-final","final-done-r1"],["c-mid","hub-done-r2"]].forEach(([id,key])=>{
  try{const n=Object.keys(JSON.parse(localStorage.getItem(key))||{}).length;if(n)document.getElementById(id).textContent=`已打勾 ${n} 項`}catch(e){}
});
</script>
</body>
</html>
